# Read-only root: udhcpc can't write /etc/resolv.conf (ro filesystem), so DHCP-provided
# DNS is written to tmpfs. /etc/resolv.conf is a symlink -> /run/resolv.conf (created in
# post-install.sh); /run is a tmpfs OpenRC mounts at boot. Alpine's default.script sources
# this file and honors RESOLV_CONF.
RESOLV_CONF="/run/resolv.conf"
