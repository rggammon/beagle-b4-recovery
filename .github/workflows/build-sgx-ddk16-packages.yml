# Audit and package the proprietary TI DDK 1.6 userspace without storing vendor
# binaries in this repository. Binary artifact upload requires explicit consent.
name: build-sgx-ddk16-packages

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: HTTPS URL for Graphics_SDK_setuplinux_4_03_00_02.bin
        required: true
        default: https://software-dl.ti.com/dsps/dsps_public_sw/sdo_sb/targetcontent/gfxsdk/4_03_00_02/exports/Graphics_SDK_setuplinux_4_03_00_02.bin
        type: string
      sdk_sha256:
        description: Verified SHA-256 of the TI installer
        required: true
        default: "cdb0bd3964e107733d632aa8224e0537b05c1ffac34befc036423458c8d75255"
        type: string
      accept_ti_eula:
        description: I have reviewed and accept the TI installer EULA
        required: true
        default: false
        type: boolean
      mode:
        description: Pipeline stage
        required: true
        default: audit
        type: choice
        options:
          - audit
          - package
      upload_ti_binary_artifacts:
        description: Upload packages containing TI binaries (license review required)
        required: true
        default: false
        type: boolean
      build_hf_shim:
        description: Build the hard-float ABI shim set (libEGL/libGLESv2 veneers)
        required: true
        default: true
        type: boolean
      build_hf_shim_14:
        description: Also build the DDK 1.4 shim by reusing the 1.6 veneers
        required: true
        default: false
        type: boolean
      sdk14_url:
        description: HTTPS URL for Graphics_SDK_setuplinux_4_00_00_01.bin (DDK 1.4)
        required: true
        default: https://software-dl.ti.com/dsps/dsps_public_sw/sdo_sb/targetcontent/gfxsdk/4_00_00_01/exports/Graphics_SDK_setuplinux_4_00_00_01.bin
        type: string
      sdk14_sha256:
        description: Verified SHA-256 of the TI 1.4 installer
        required: true
        default: "62383d15e33adf9349afba063b0f2405a15aa6c4b0b5579b0abdf81db7580df7"
        type: string

jobs:
  build:
    if: inputs.accept_ti_eula
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make curl file binutils coreutils debhelper devscripts dpkg-dev \
            build-essential gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            python3-pyelftools
          # Ubuntu's apt patchelf (0.18) mislays .dynamic outside a PT_LOAD on the
          # DWARF-heavy DDK libs; use the newer pip build (0.19+) instead.
          python3 -m pip install --user --break-system-packages 'patchelf>=0.19'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Audit TI SDK userspace
        working-directory: sgx-ddk16
        env:
          SDK_URL: ${{ inputs.sdk_url }}
          SDK_SHA256: ${{ inputs.sdk_sha256 }}
          ACCEPT_TI_EULA: "yes"
        run: make audit

      - name: Build Debian packages
        if: inputs.mode == 'package'
        working-directory: sgx-ddk16
        env:
          SDK_URL: ${{ inputs.sdk_url }}
          SDK_SHA256: ${{ inputs.sdk_sha256 }}
          ACCEPT_TI_EULA: "yes"
        run: make package

      # The shim .so's (libEGL/libGLESv2 veneers, libsgxhf loader, libSGXm
      # interposer) are our own code. The build's ABI audit fails CI if the
      # shims are not hard-float or libSGXm lacks the versioned float symbols.
      - name: Build hard-float ABI shim
        if: inputs.build_hf_shim
        working-directory: sgx-ddk16
        env:
          SDK_URL: ${{ inputs.sdk_url }}
          SDK_SHA256: ${{ inputs.sdk_sha256 }}
          ACCEPT_TI_EULA: "yes"
          CROSS_HF: arm-linux-gnueabihf-gcc
        run: make hf-shim

      # Reuse the 1.6-DWARF veneers (identical Khronos EGL 1.4/GLES2 ABI) to
      # build the 1.4 shim. The coverage gate fails on any export-set drift and
      # the header-diff gate fails on any core ABI header change between SDKs.
      - name: Build DDK 1.4 hard-float shim (veneer reuse)
        if: inputs.build_hf_shim && inputs.build_hf_shim_14
        working-directory: sgx-ddk16
        env:
          SDK_URL: ${{ inputs.sdk_url }}
          SDK_SHA256: ${{ inputs.sdk_sha256 }}
          SDK14_URL: ${{ inputs.sdk14_url }}
          SDK14_SHA256: ${{ inputs.sdk14_sha256 }}
          ACCEPT_TI_EULA: "yes"
          CROSS_HF: arm-linux-gnueabihf-gcc
        run: make hf-shim-14

      - name: Upload ELF audit
        uses: actions/upload-artifact@v5
        with:
          name: sgx-ddk16-elf-audit
          path: sgx-ddk16/build/audit/
          if-no-files-found: error

      - name: Upload packages containing TI binaries
        if: inputs.mode == 'package' && inputs.upload_ti_binary_artifacts
        uses: actions/upload-artifact@v5
        with:
          name: sgx-ddk16-debs
          path: sgx-ddk16/dist/*.deb
          if-no-files-found: error
          retention-days: 1

      # Our shim code + generated veneers: no TI binaries, safe to upload.
      - name: Upload hard-float shim libraries
        if: inputs.build_hf_shim
        uses: actions/upload-artifact@v5
        with:
          name: sgx-ddk16-hf-shim
          path: |
            sgx-ddk16/build/hf-shim/lib/
            sgx-ddk16/build/hf-shim/gen/
          if-no-files-found: error

      # 1.4 shim libraries + reuse/header-diff gate artifacts: our own code.
      - name: Upload DDK 1.4 hard-float shim libraries
        if: inputs.build_hf_shim && inputs.build_hf_shim_14
        uses: actions/upload-artifact@v5
        with:
          name: sgx-ddk16-hf-shim-14
          path: |
            sgx-ddk16/build/hf-shim-14/lib/
            sgx-ddk16/build/hf-shim-14/gen/
          if-no-files-found: error

      # The patched DDK carries TI binaries; gate it on the same consent flag.
      - name: Upload libSGXm-first patched DDK
        if: inputs.build_hf_shim && inputs.upload_ti_binary_artifacts
        uses: actions/upload-artifact@v5
        with:
          name: sgx-ddk16-hf-shim-ddk
          path: sgx-ddk16/build/hf-shim/ddk/
          if-no-files-found: error
          retention-days: 1

      # The patched 1.4 DDK also carries TI binaries; same consent gate.
      - name: Upload libSGXm-first patched DDK 1.4
        if: inputs.build_hf_shim && inputs.build_hf_shim_14 && inputs.upload_ti_binary_artifacts
        uses: actions/upload-artifact@v5
        with:
          name: sgx-ddk16-hf-shim-14-ddk
          path: sgx-ddk16/build/hf-shim-14/ddk/
          if-no-files-found: error
          retention-days: 1
