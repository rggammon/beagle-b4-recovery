# Audit and package the proprietary TI DDK 1.4 userspace without storing vendor
# binaries in this repository. Binary artifact upload requires explicit consent.
# Mirrors build-sgx-ddk16-packages.yml for the storm-free DDK 1.4 reference stack.
name: build-sgx-ddk14-packages

on:
  workflow_dispatch:
    inputs:
      ddk_build:
        description: DDK 1.4 build (SDK version)
        required: true
        default: "2616"
        type: choice
        options:
          - "2616"
          - "2514"
      accept_ti_eula:
        description: I have reviewed and accept the TI installer EULA
        required: true
        default: false
        type: boolean
      mode:
        description: Pipeline stage
        required: true
        default: audit
        type: choice
        options:
          - audit
          - package
      upload_ti_binary_artifacts:
        description: Upload packages containing TI binaries (license review required)
        required: true
        default: false
        type: boolean

jobs:
  build:
    if: inputs.accept_ti_eula
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make curl file binutils coreutils debhelper devscripts dpkg-dev \
            build-essential python3 python3-pexpect

      # Pin the checksum-verified installer URL + SHA-256 for each 1.4 build.
      # The 2514 (3.01.00.02) installer uses the OMAP35x_ name and pages its EULA.
      - name: Resolve SDK source
        env:
          DDK_BUILD: ${{ inputs.ddk_build }}
        run: |
          base=https://software-dl.ti.com/dsps/dsps_public_sw/sdo_sb/targetcontent/gfxsdk
          case "$DDK_BUILD" in
            2616)
              URL=$base/4_00_00_01/exports/Graphics_SDK_setuplinux_4_00_00_01.bin
              SHA=62383d15e33adf9349afba063b0f2405a15aa6c4b0b5579b0abdf81db7580df7 ;;
            2514)
              URL=$base/3_01_00_02/exports/OMAP35x_Graphics_SDK_setuplinux_3_01_00_02.bin
              SHA=151d7ce8cbf192a3f0c7e232a5b958cde224309be9ec74ca40031be7d27fa265 ;;
            *) echo "unknown ddk_build '$DDK_BUILD'" >&2; exit 1 ;;
          esac
          echo "SDK_URL=$URL" >> "$GITHUB_ENV"
          echo "SDK_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Audit TI SDK userspace
        working-directory: sgx-ddk14
        env:
          DDK_BUILD: ${{ inputs.ddk_build }}
          ACCEPT_TI_EULA: "yes"
        run: make audit

      - name: Build Debian packages
        if: inputs.mode == 'package'
        working-directory: sgx-ddk14
        env:
          DDK_BUILD: ${{ inputs.ddk_build }}
          ACCEPT_TI_EULA: "yes"
        run: make package

      - name: Upload ELF audit
        uses: actions/upload-artifact@v5
        with:
          name: sgx-ddk14-${{ inputs.ddk_build }}-elf-audit
          path: sgx-ddk14/build/audit/
          if-no-files-found: error

      - name: Upload packages containing TI binaries
        if: inputs.mode == 'package' && inputs.upload_ti_binary_artifacts
        uses: actions/upload-artifact@v5
        with:
          name: sgx-ddk14-${{ inputs.ddk_build }}-debs
          path: sgx-ddk14/dist/*.deb
          if-no-files-found: error
          retention-days: 1
