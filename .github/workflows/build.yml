# Draft CI: download pristine U-Boot/Linux/Alpine, apply our patches/config, build the
# NAND recovery flasher image. NOTE: the SD-boot u-boot variant isn't wired up yet
# (uboot/build.sh only builds the NAND variant) -- expect a round or two of iteration.
name: build

on:
  # Manual builds only. Pushing a version tag (vX.Y.Z) also builds and publishes a release.
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf bc bison flex libssl-dev \
            u-boot-tools mtd-utils mtools dosfstools xz-utils wget python3 \
            qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-arm || true

      - name: Build kernel (zImage + omap3-beagle-ab4.dtb = the fix)
        run: ./kernel/build.sh

      - name: Build U-Boot (NAND variant)
        run: ./uboot/build.sh

      - name: Build read-only Alpine rootfs (UBIFS)
        run: sudo -E ./rootfs/build.sh

      - name: Assemble NAND flasher SD image
        run: ./flash/build-flasher.sh

      - name: Checksums
        run: cd out && sha256sum beagle-nand-flasher.img.xz > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: beagle-nand-flasher
          path: |
            out/beagle-nand-flasher.img.xz
            out/SHA256SUMS
          if-no-files-found: error

      - name: Publish release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/beagle-nand-flasher.img.xz
            out/SHA256SUMS
