# CI: download pristine U-Boot/Linux/Alpine, apply our patches, build the NAND recovery
# flasher image. U-Boot 2024.07 produces one binary that serves both SD boot and NAND.
name: build

on:
  # Manual builds only. Pushing a version tag (vX.Y.Z) also builds and publishes a release.
  workflow_dispatch:
    inputs:
      alpine_mirror:
        description: Alpine package mirror base URL
        required: false
        default: https://mirrors.edge.kernel.org/alpine
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ALPINE_MIRROR: ${{ inputs.alpine_mirror || 'https://mirrors.edge.kernel.org/alpine' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf bc bison flex libssl-dev swig python3-dev \
            u-boot-tools mtd-utils mtools dosfstools xz-utils wget python3 kmod \
            qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-arm || true

      - name: Build kernel (zImage + omap3-beagle-ab4.dtb = the fix)
        run: ./kernel/build.sh

      - name: Build U-Boot 2024.07 (SD boot + NAND, one binary)
        run: ./uboot/build.sh

      - name: Build read-only Alpine rootfs (UBIFS)
        run: |
          for attempt in 1 2 3; do
            echo "Alpine rootfs build attempt $attempt/3"
            sudo -E ./rootfs/build.sh && exit 0
          done
          exit 1

      - name: Assemble NAND flasher SD image
        run: ./flash/build-flasher.sh

      - name: Assemble SD-card appliance image
        run: ./flash/build-sdcard.sh

      - name: Checksums
        run: cd out && sha256sum beagle-nand-flasher.img.xz beagle-sdcard.img.xz > SHA256SUMS

      - name: Upload NAND flasher image
        uses: actions/upload-artifact@v5
        with:
          name: beagle-nand-flasher
          path: |
            out/beagle-nand-flasher.img.xz
            out/SHA256SUMS
          if-no-files-found: error

      - name: Upload SD-card appliance image
        uses: actions/upload-artifact@v5
        with:
          name: beagle-sdcard
          path: |
            out/beagle-sdcard.img.xz
            out/SHA256SUMS
          if-no-files-found: error

      - name: Publish release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/beagle-nand-flasher.img.xz
            out/beagle-sdcard.img.xz
            out/SHA256SUMS
